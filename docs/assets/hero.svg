<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">SaqtaDauys — Voice Router</title>
  <desc id="description">От живой речи к нужному сценарию. Голосовой страховой ассистент на русском и казахском. Хакатонный проект команды Zethus.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#102e2b"/>
      <stop offset="1" stop-color="#111e2a"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#background)"/>
    <circle cx="1100" cy="30" r="160" fill="none" stroke="#28483f"/>
    <circle cx="1100" cy="30" r="210" fill="none" stroke="#203b36"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <circle cx="54" cy="43" r="5" fill="#86efac"/>
      <text x="72" y="48" fill="#b6d0c9" font-size="13" font-weight="700" letter-spacing="3">VOICE ROUTER / TEAM ZETHUS</text>
      <text x="48" y="134" fill="#f4fbf8" font-size="62" font-weight="700" letter-spacing="-2">SaqtaDauys</text>
      <text x="51" y="177" fill="#d2ebe3" font-size="22">От живой речи — к нужному сценарию.</text>
      <text x="51" y="212" fill="#9ab8b0" font-size="16">Голосовой страховой ассистент для хакатона</text>
      <g font-size="13" fill="#d2ebe3">
        <rect x="50" y="257" width="95" height="35" rx="17.5" fill="#1d3937" stroke="#34504a"/>
        <text x="97.5" y="279" text-anchor="middle">RU + KK</text>
        <rect x="155" y="257" width="133" height="35" rx="17.5" fill="#1d3937" stroke="#34504a"/>
        <text x="221.5" y="279" text-anchor="middle">43 сценария</text>
        <rect x="298" y="257" width="147" height="35" rx="17.5" fill="#1d3937" stroke="#34504a"/>
        <text x="371.5" y="279" text-anchor="middle">Telegram demo</text>
      </g>
      <rect x="803" y="62" width="333" height="214" rx="20" fill="#142d2e" stroke="#33564d"/>
      <circle cx="834" cy="95" r="4" fill="#86efac"/>
      <text x="849" y="100" fill="#a7d7c7" font-size="12" letter-spacing="2">СЛУШАЮ ВАС</text>
      <path d="M834 162v12 M846 153v30 M858 145v46 M870 154v28 M882 131v74 M894 143v50 M906 159v18 M918 141v54 M930 121v94 M942 139v58 M954 152v32 M966 145v46 M978 130v76 M990 143v50 M1002 158v20 M1014 151v34 M1026 139v58 M1038 146v44 M1050 133v70 M1062 145v46 M1074 155v26 M1086 149v38 M1098 162v12" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
      <text x="969.5" y="253" text-anchor="middle" fill="#9ab8b0" font-size="13">Речь → Сценарий → Ответ</text>
    </g>
  </g>
</svg>
