[tool.ruff]
target-version = "py310"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# В точках входа сначала настраивается импорт при прямом запуске скрипта.
"src/main_router.py" = ["E402"]
"src/chat_demo.py" = ["E402"]
"src/telegram_bot.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
